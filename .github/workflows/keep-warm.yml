name: Keep backend warm

# Render's free tier puts the backend to sleep after 15 minutes without
# traffic, and waking it takes about a minute. Pinging the health check every
# 10 minutes keeps it awake so visitors do not wait for a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 120 https://leadforge-ai-m8d8.onrender.com/health
